name: Stacked PR order guard

# Publishes a `stacked-pr-order` commit status on every open pull request.
# A pull request fails the check while another open pull request targets its
# head branch, because merging it first strands the dependent work on a base
# that no longer has an open pull request pointing at it.
#
# Every run re-evaluates all open pull requests rather than just the one that
# triggered it: opening a stacked pull request has to block its parent, and
# closing it has to clear the parent again.

on:
  pull_request:
    types: [opened, reopened, closed, edited, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: stacked-pr-order
  cancel-in-progress: false

jobs:
  guard:
    # Fork pull requests receive a read-only token, so the status write would
    # fail. Same-repo branches are the workflow this guard exists for.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out guard sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/lib
          sparse-checkout-cone-mode: false

      - name: Publish stacked-pr-order statuses
        uses: actions/github-script@v7
        with:
          script: |
            const { planStackedOrderStatuses, summarizeStackedOrderStatuses } =
              await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/stacked-pr-order.mjs`)

            const open = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })

            const statuses = planStackedOrderStatuses(open.map((pull) => ({
              number: pull.number,
              head: pull.head.ref,
              base: pull.base.ref,
              sha: pull.head.sha,
            })))

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            for (const status of statuses) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: status.sha,
                context: status.context,
                state: status.state,
                description: status.description,
                target_url: runUrl,
              })
            }

            core.summary.addHeading('Stacked PR order guard', 2)
            core.summary.addRaw(summarizeStackedOrderStatuses(statuses), true)
            await core.summary.write()
