name: spec-from-design
description: >-
  Turn a design prototype or feature brief into an implementable slice spec. Three gates catch the
  defects post-hoc review misses — a claims ledger (every platform claim carries a file:line to the
  code that PERFORMS it), an out-of-scope-edit ledger, and a frozen-surface list. Each gate is a
  self-improving loop: an agent step produces, a command step evaluates a countable threshold, and
  onFail sends the agent back until the threshold is met — or until the divergence detector halts
  the loop and escalates to a human. Rationale and the defect each gate caught:
  .ai/docs/spec-pipeline-runbook.md
steps:
  - id: setup
    name: Install skills + commit the input
    command: "corepack yarn install-skills && mkdir -p .ai/analysis/spec-pipeline && rm -f .ai/analysis/spec-pipeline/HALT && echo '--- skills installed, gate state reset. Commit the design prototype before step 2. ---'"

  - id: shape
    name: Shape the scope
    prompt: >-
      Task: {{task}}

      Read .ai/docs/spec-pipeline-runbook.md first — it is the method for this whole workflow, and
      its section "Loops and thresholds" explains how the gate steps below control you.

      Run om-brainstorm (or om-ux-shape if the input is a vague UI/UX idea). Repo-local skills are
      not Skill-tool registered; if you get "Unknown skill", read .ai/skills/<name>/SKILL.md or
      .agents/skills/<name>/SKILL.md and execute it by hand.

      Commit the design prototype / input artifact into the repo NOW. Working copies in tmp/ do not
      survive, and a later reviewer must read it as a FIXTURE — its data — not as a picture.

      Surface every scope decision you cannot resolve from the input, the codebase or a sensible
      default, and emit them as ONE CEZ:ASK block with 2-4 questions. Write no spec text until they
      are answered.

  - id: survey
    name: Platform survey
    prompt: >-
      Run om-gap-analysis to establish the reuse-vs-build boundary with executable coverage
      verdicts rather than a hand-rolled Grep/Read sweep.

      For every capability the feature needs, record a verdict WITH its evidence path. Capture
      file:line now, while you have it — the next gate will demand it.

  - id: draft
    name: Draft spec and plan
    prompt: >-
      Run /speckit-specify then /speckit-plan for the answered scope.

      Repo specifics: there is no .specify scaffolding. Derive the Constitution Check from root
      AGENTS.md + BACKWARD_COMPATIBILITY.md + .ai/ds-rules.md, and relocate output from specs/NNN-*/
      to .ai/specs/{YYYY-MM-DD}-{kebab}.md per .ai/specs/AGENTS.md.

      On top of the numbered FR list, add numbered INVARIANTS. Each names the module that WRITES the
      constrained column, the transaction it is written in, and the behaviour when that module is
      absent. An FR list cannot express those, and they are where the real defects hide.

  - id: claims-ledger
    name: "GATE 1 — Claims ledger"
    prompt: >-
      Run om-verify-spec-claims against the spec and every companion artifact. It is repo-local and
      NOT Skill-tool registered — read .ai/skills/om-verify-spec-claims/SKILL.md and execute it.

      The skill reports; YOU apply the outcome. Strike every REFUTED row from the spec, narrow every
      OVERSTATED row to what is actually true, and treat every UNCITABLE row that carries a decision
      as blocking.

      Then write .ai/analysis/spec-pipeline/gate-state.json with the `gates.claims` block:
      rows · confirmed · overstated · refuted · uncitable · loadBearingUnresolved ·
      unstruckFalseClaims · ungated · newClaimsIntroduced · rowsResolved.

      COUNT every figure from the ledger. Do not assert one from memory — a miscounted headline that
      propagated across four documents is one of the defects this pipeline exists to catch.

      If you are re-entering this step after a failed gate: copy the previous `gates` block to
      `previous.gates` and increment `round` FIRST. The divergence detector reads those two fields,
      and without them it cannot tell a converging loop from a diverging one.

      Set `ungated: true` if you both wrote and verified the claims. That is not a failure to hide —
      the Architect reviewer re-runs the ledger independently later, which is what clears it.

  - id: claims-gate
    name: "▶ threshold — claims"
    command: "node .ai/scripts/spec-gate-check.mjs claims --max-rounds 3"
    onFail:
      retry: claims-ledger
      max: 3

  - id: decompose
    name: Decompose into file-pathed tasks
    prompt: >-
      Run /speckit-tasks scoped to ONE slice. Every task names a file path.

      Then apply the write-path test as a detector, not a formality: for every headline requirement,
      name the task that performs its WRITE. If no task writes it, the requirement has no mechanism
      — say so explicitly and either add the task or cut the requirement from the slice.

      Regenerate task IDs; never renumber with a regex sweep. Then verify every task
      cross-reference in every artifact still points at the task it names, and count the ones that
      do not.

      Update gate-state.json `gates.writePath`: headlineRequirements · withWriteTask · staleTaskRefs.

  - id: writepath-gate
    name: "▶ threshold — write path"
    command: "node .ai/scripts/spec-gate-check.mjs write-path --max-rounds 2"
    onFail:
      retry: decompose
      max: 2

  - id: core-ledger
    name: "GATE 2 — Out-of-scope-edit ledger"
    prompt: >-
      Build the ledger from .ai/docs/spec-pipeline-runbook.md, Gate 2.

      FIRST find and quote this repo's actual rule on editing shared/core code. In open-mercato it is
      packages/core/AGENTS.md section Extensions — "never mutate core entities" — which is scoped to
      entities, not to editing core generally. Quote what you find; if no such rule exists, say so
      rather than inventing one.

      Enumerate EVERY file outside the new package the plan touches. Classify each: (a) new file,
      (b) additive DI/registry entry, (c) additive optional field, (d) entity or table change,
      (e) function signature or behaviour change.

      Rows (d) and (e) must each state why the sanctioned extension route was rejected — the
      EntityExtension / data/extensions.ts mechanism, custom fields, or a widget injection spot — and
      must be assigned to a separate upstream PR merged before the consuming PR. See
      packages/core/src/modules/communication_channels/data/extensions.ts for the shipped pattern.

      Read-only access to a peer module's data has no sanctioned mechanism here: adding a
      source-owned DI read facade is a legitimate (a)+(b) core edit per .ai/lessons.md →
      "Cross-module query precedent is not permission to copy storage coupling". Record it rather
      than letting it pass unremarked.

      Update gate-state.json `gates.coreEdit`: rows · classDorE · justified · assignedUpstreamPr ·
      ruleQuoted.

  - id: coreedit-gate
    name: "▶ threshold — out-of-scope edits"
    command: "node .ai/scripts/spec-gate-check.mjs core-edit --max-rounds 2"
    onFail:
      retry: core-ledger
      max: 2

  - id: review
    name: Adversarial review — four roles
    prompt: >-
      Spawn FOUR review agents in parallel, each blocked from reading the others until it has
      written its own findings. Give each the spec, the plan, the task graph and both ledgers.

      DDD — invariants, derived formulas, glossary, cardinality. Hunt contradictions between
      invariants and formulas, and metrics that are gameable.

      Architect — platform claims against source. Re-run om-verify-spec-claims independently: this
      is the non-author verification the skill requires, and it is what clears `ungated`. Assume the
      ledger is incomplete; verify behaviour, not existence.

      PM/UX — the committed prototype AS A FIXTURE. Read its data, not its pixels: reconcile every
      number the spec takes from it, and find screens or states with no requirement.

      Implementer — the task graph only. "Give me the file list, I am building this Monday." Find
      requirements with no write path, unpathed work, stale cross-references, and anything that
      would force a decision at implementation time.

      Write one review register naming each finding, its severity and its evidence. Where two
      reviewers disagree, ADJUDICATE — do not average. One has usually gone a level deeper.

      Update gate-state.json `gates.review`: rolesRun · newFindings · dryRounds ·
      unresolvedCritical. `dryRounds` counts CONSECUTIVE rounds that produced no new finding —
      increment it when newFindings is 0, reset it to 0 otherwise. Also clear `gates.claims.ungated`
      if the Architect re-ran the ledger.

  - id: remediate
    name: Remediate once
    prompt: >-
      FIRST: if .ai/analysis/spec-pipeline/HALT exists, STOP. Do not revise anything. Read it, then
      report what is unresolved, what would settle it and who produces that, and emit a CEZ:ASK
      asking the owner how to proceed. The halt fired because another revision is the wrong move —
      three rounds on one document once produced wrong sum, then wrong subtraction, then wrong unit,
      each round fixing the last defect and introducing a subtler one.

      Otherwise apply the review findings ONCE.

      Do not revise the same document a third time in place. If it has already been revised twice,
      freeze it and write the NEXT artifact — the phase or slice spec — instead of another version
      of the same one. A delta against an overwritten predecessor is worse than either.

      Never leave a claim you know to be false in the shipped text, even under a warning banner.
      Strike the sentence and leave [RETRACTED — see <review file> section N].

      For any question that cannot be closed by specifying — a number that depends on data no
      fixture contains — say so, name what would close it, and name the deliverable that produces
      that data.

  - id: review-gate
    name: "▶ threshold — review dry"
    command: "node .ai/scripts/spec-gate-check.mjs review --max-rounds 3"
    onFail:
      retry: review
      max: 3

  - id: audit
    name: Readiness audit
    prompt: >-
      Run om-pre-implement-spec (.ai/skills/om-pre-implement-spec/SKILL.md — not Skill-tool
      registered) and /speckit-analyze.

      These close the internal-consistency axis: canonical-mechanism omissions (mutation-guard
      wiring on custom write routes, encryption.ts maps with hashField for equality lookups, zod
      validators, module paths), cross-artifact consistency and coverage. They will NOT catch a
      wrong premise — that was Gate 1's job.

      Apply every critical and major finding. If any of them invalidates a claim, update
      gate-state.json and expect the gates to re-open.

  - id: freeze
    name: "GATE 3 — Frozen-surface list"
    prompt: >-
      Write ONE authoritative frozen-surface file covering all 14 BACKWARD_COMPATIBILITY.md
      surfaces: module/package IDs, event IDs, ACL feature IDs, widget spot IDs, DB tables and
      enums, DI names, notification type IDs, AI agent/tool IDs, import paths, query-index entity
      types and DataTable ids.

      Enumerate ACL feature IDs individually — never behind a <key> wildcard. They are stored in the
      DB and renaming one later needs a data migration.

      Check every widget spot ID against the shipped host declaration in that module's
      extension-points.ts, INCLUDING its parameter regex — a plausible-looking spot name the host
      regex rejects is a silent failure.

      State at the top: "where any other document disagrees with this file, this file wins." Add a
      decision log. Then reconcile every other document against it and count what disagreed.

      Update gate-state.json `gates.frozenSurfaces`: surfacesTotal · surfacesCovered ·
      conflictsWithOtherDocs · wildcardedIds.

  - id: frozen-gate
    name: "▶ threshold — frozen surfaces"
    command: "node .ai/scripts/spec-gate-check.mjs frozen --max-rounds 2"
    onFail:
      retry: freeze
      max: 2

  - id: ds
    name: Design-system review
    prompt: >-
      Run om-ds-guardian over every new UI composite the spec introduces, BEFORE implementation
      locks the patterns in.

      Design prototypes reliably violate the hardcoded-status-colour, arbitrary-value and
      raw-<button> rules throughout. Map each prototype pattern to its design-system primitive in
      the spec, so a literal port is not the path of least resistance.

  - id: judge
    name: Neutral judge pass
    prompt: >-
      Run om-judge-agent-session over this session for an independent read: validation evidence,
      project guards, design-system compliance, and whether the ledgers actually hold.

      This is the independent sign-off. Report its verdict verbatim, including anything it
      contradicts in the work above.

  - id: final-gate
    name: "▶ Definition of done — all thresholds"
    command: "node .ai/scripts/spec-gate-check.mjs all --max-rounds 99 && sed -n '/^## Definition of done/,$p' .ai/docs/spec-pipeline-runbook.md"
